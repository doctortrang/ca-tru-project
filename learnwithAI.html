<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn with AI</title>
    <link rel="icon" sizes="32x32" href="folk-music.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="learnwithAI.css">
    <script src="types.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Calligraffitti&family=Fira+Sans&family=Oleo+Script&family=Raleway&family=Righteous&family=Roboto:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="index.html">
                        <img class="menu-button" src="g-clef-musical-note.png" alt="menu">
                    </a>
                </li>
                <li>
                    <a href="" id="Definition">What is Ca Tru?</a>
                </li>
                <li>
                    <a id="AI" href="learnwithAI.html">Learn with AI</a>
                </li>
                <li>
                    <a id="VR" href="VR.html">VR/AR Experience</a>
                </li>
                <li>
                    <a id="archirve" href="">Library</a>
                </li>
                <li>
                    <a id="community" href="">Community</a>
                </li>
                <li>
                    <a id="support" href="">Support</a>
                </li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <!-- LEFT -->
        <div class="left">
            <h2>Input</h2>
            <div class="input-card">
                <canvas id="waveCanvas"></canvas>
                <div class="record-box" onclick="toggleRecording()" id="recordBox">
                <div class="mic">🎤</div>
                    <p id="recordText">Start Recording</p>
                </div>
            <div class="timer" id="timer">00:00:00:00</div>
        </div>
    </div>
         <!-- RIGHT -->
        <div class="right">
            <h2>Output</h2>
                <div class="score-panel">
                    <h3>Score panel</h3>
                <div class="item">
                    <p>Pitch Level</p>
                <div class="bar"><div class="fill w70"></div></div>
        </div>
        <div class="item">
            <p>Rhythm</p>
            <div class="bar">
                <div class="fill w90">
                </div>
            </div>
        </div>
        <div class="item">
            <p>Beat</p>
            <div class="bar"><div class="fill w60"></div></div>
            </div>
        </div>
        <div class="feedback">
            <h3>Feedback box</h3>
            <input value="...">
        </div>
    </div>
    </div>
    <!-- CHATBOT -->
    <div class="chatbot">
        <div class="chat-header">AI Chatbot ✕</div>
        <div class="chat-body">
        <div class="msg user">Hello!</div>
        <div class="msg bot">Ask about pitch and beat</div>
    </div>
    <div class="chat-input">
        <input placeholder="Learn about Ca Tru...">
        <button>➤</button>
    </div>
    </div>
</body>
