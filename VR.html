        <h1>🎭 Experience VR Stage (VR 360°)</h1>

<div class="vr-container">
  <a-scene embedded>

    <!-- Ảnh 360 -->
    <a-sky src="ca-tru-project/Stage.png"></a-sky>

    <!-- Âm thanh nền -->
    <a-sound src="" autoplay="true" loop="true"></a-sound>

    <!-- Tiêu đề -->
    <a-text value="Ca Tru Stage"
            position="0 2 -3"
            align="center"
            color="#FFF"
            width="6">
    </a-text>

    <!-- Hotspot 1 -->
    <a-sphere position="2 1 -3" radius="0.3" color="red" event-set__click="scale: 1.5 1.5 1.5"></a-sphere>
    <a-text value="Đào nương biểu diễn"
            position="2 1.5 -3"
            color="#FFF"
            width="4">
    </a-text>

    <!-- Hotspot 2 -->
    <a-sphere position="-2 1 -3" radius="0.3" color="blue" event-set__click="scale: 1.5 1.5 1.5"></a-sphere>
    <a-text value="Nhạc cụ phách"
            position="-2 1.5 -3"
            color="#FFF"
            width="4">
    </a-text>

    <!-- Camera -->
    <a-camera>
      <a-cursor></a-cursor>
    </a-camera>

  </a-scene>
</div>
