      <style>
          *{
    scroll-behavior: smooth;
}
body {
    margin: 0;
}
header {
    width: 100%;
    position: relative;
    box-shadow: none;
}
nav {
    width: 100%;
    font-family: 'Raleway';
    font-weight: bold;
    font-size: 1.2rem;
    text-align: center;
    background-color: rgb(255, 255, 255);
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.4);;
}
nav ul {
    margin: 0;
    list-style: none;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
}
nav ul li {
    display: flex;
    padding: 1.2rem 3rem;
    align-items: center;
}
nav ul li a{
    color: rgb(56, 50, 50);
    text-decoration: none;
}
nav ul li a:hover {
    color: rgb(58, 33, 0);
    text-decoration: underline;
}
.menu-button {
    width: 3rem;
    height: auto;
    padding-right: 2rem;
}
.quote {
    padding-top: 15rem;
    align-items: center;
    text-align: center;
    font-family: 'Raleway';
    font-size: 1.5rem;
    font-weight: bolder;
    color: white;
}
.quote p {
    padding-bottom: 2rem;
}
.discover {
    position: relative;
    overflow: hidden;
}
.discover::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url(https://static.vinwonders.com/production/Ca-Tru-Singing-1536x990.jpg) no-repeat center/cover;
    filter: blur(3.5px);
    z-index: -1;
}
.discover-content{
    align-items: center;
    text-align: center;
    margin: 0;
    padding-bottom: 20rem;
}
.discover-content a{
    margin: 20px;
    text-decoration: none;
    font-family: 'Raleway';
    font-size: 1.5rem;
    font-weight: bolder;
    padding: 1rem;
    padding-left: 1.5rem;
    padding-right: 1.5rem;
    color: rgb(27, 27, 27);
    background-color: rgba(233, 219, 201, 0.8);
    border-radius: 20px;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.4);
    transition: background-color ease-out 0.4s 0.2s;
}
.discover-content a:hover{
    background-color: rgb(255, 208, 66);
}
.icon-discover {
    width: 20px;
    height: 20px;
}
.types {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 2rem;
    font-family: 'Fira Sans';
}
.types h2 {
    font-size: 2rem;
    font-family: 'Raleway';
    text-transform: uppercase;
    padding: 0.5rem;
}
.types li a {
    padding: 1rem;
    text-decoration: none;
    color: rgb(34, 34, 34);
    overflow: hidden;
}
.types img {
    width: 50%;
    height: auto;
    object-fit: cover;
}
.types ul {
    margin: 1rem;
    padding: 0;
    list-style: none;
    display: flex;
    grid-template-columns: 0.5fr 1fr 1fr;
}
.types li {
    margin: 2rem;
    width: 25rem;
    display: flex;
    flex-direction: row;
    border-radius: 10px;
    background-color: white;
    box-shadow: 8px 8px 8px rgba(0, 0, 0, 0.2);
    transition: transform 0.25s ease-out 0.08s;
    overflow: hidden;
    text-align: left;
}
.types li:hover {
    transform: scale(1.05);
}
.types-content {
    padding: 1rem;
}
.video-section {
  padding: 40px;
  text-align: center;
  font-family: 'Raleway';
}

.video-caption {
  margin-top: 10px;
  font-style: italic;
  color: #555;
}
.divider {
  border: none;
  height: 1px;
  background: rgba(0, 0, 0, 0.1);
  margin: 40px 0;
}
.timeline {
    padding: 3rem;
    position: relative;
    margin-left: 20rem;
    align-items: center;
    font-family: 'Raleway';
}

.timeline-item {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    font-family: 'Raleway';
}

.circle {
    width: 15px;
    height: 15px;
    background: rgba(73, 31, 1, 0.83);
    border-radius: 50%;
    margin-right: 20px;
}

.content {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 8px;
}
footer {
    height: 5rem;
    width: 100%;
    background-color: rgb(58, 34, 2);
    color: rgb(245, 245, 245);
    font-size: 1rem;
    font-family: 'Fira Sans';
    text-align: center;
    position: absolute;
}
    body {
      margin: 0;
      font-family: 'Raleway';
      color: white;
      text-align: center;
    }

    h1 {
      margin: 10px;
    }

    .vr-container {
      width: 100%;
      height: 80vh;
    }
</head>

        <h1>🎭 Experience VR Stage (VR 360°)</h1>

<a-scene embedded>

  <!-- Assets (QUAN TRỌNG) -->
  <a-assets>
    <img id="stage" src="ca-tru-prject/Stage.png">
    <audio id="bgmusic" src="ca-tru-prject/sound.mp3"></audio>
  </a-assets>

  <!-- Ảnh 360 -->
  <a-sky src="#stage" rotation="0 -90 0"></a-sky>

  <!-- Âm thanh -->
  <a-entity sound="src: #bgmusic; autoplay: true; loop: true"></a-entity>

  <!-- Tiêu đề -->
  <a-text value="Ca Tru Stage"
          position="0 2 -3"
          align="center"
          color="#FFF"
          width="6">
  </a-text>

  <!-- Hotspot 1 -->
  <a-sphere position="2 1 -3"
            radius="0.3"
            color="red"
            event-set__enter="_event: mouseenter; scale: 1.3 1.3 1.3"
            event-set__leave="_event: mouseleave; scale: 1 1 1"
            event-set__click="_event: click; color: yellow">
  </a-sphere>

  <a-text value="Đào nương biểu diễn"
          position="2 1.6 -3"
          align="center"
          color="#FFF"
          width="4">
  </a-text>

  <!-- Hotspot 2 -->
  <a-sphere position="-2 1 -3"
            radius="0.3"
            color="blue"
            event-set__enter="_event: mouseenter; scale: 1.3 1.3 1.3"
            event-set__leave="_event: mouseleave; scale: 1 1 1"
            event-set__click="_event: click; color: green">
  </a-sphere>

  <a-text value="Nhạc cụ phách"
          position="-2 1.6 -3"
          align="center"
          color="#FFF"
          width="4">
  </a-text>

  <!-- Camera VR -->
  <a-entity camera look-controls>
    <a-cursor fuse="true" fuse-timeout="1000"></a-cursor>
  </a-entity>

</a-scene>
</div>
</body>
