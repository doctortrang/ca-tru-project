        <h1>🎭 Experience VR Stage (VR 360°)</h1>

<a-scene embedded>

  <!-- Assets (QUAN TRỌNG) -->
  <a-assets>
    <img id="stage" src="ca-tru-project/Stage.png">
    <audio id="bgmusic" src="ca-tru-project/sound.mp3"></audio>
  </a-assets>

  <!-- Ảnh 360 -->
  <a-sky src="#stage" rotation="0 -90 0"></a-sky>

  <!-- Âm thanh -->
  <a-entity sound="src: #bgmusic; autoplay: true; loop: true"></a-entity>

  <!-- Tiêu đề -->
  <a-text value="Ca Tru Stage"
          position="0 2 -3"
          align="center"
          color="#FFF"
          width="6">
  </a-text>

  <!-- Hotspot 1 -->
  <a-sphere position="2 1 -3"
            radius="0.15"
            color="red"
            event-set__enter="_event: mouseenter; scale: 1.3 1.3 1.3"
            event-set__leave="_event: mouseleave; scale: 1 1 1"
            event-set__click="_event: click; color: yellow">
  </a-sphere>

  <a-text value="Artist"
          position="2 1.6 -3"
          align="center"
          color="#FFF"
          width="2">
  </a-text>

  <!-- Hotspot 2 -->
  <a-sphere position="-2 1 -3"
            radius="0.15"
            color="blue"
            event-set__enter="_event: mouseenter; scale: 1.3 1.3 1.3"
            event-set__leave="_event: mouseleave; scale: 1 1 1"
            event-set__click="_event: click; color: green">
  </a-sphere>

  <a-text value="Beat"
          position="-2 1.6 -3"
          align="center"
          color="#FFF"
          width="2">
  </a-text>

  <!-- Camera VR -->
  <a-entity camera look-controls>
    <a-cursor fuse="true" fuse-timeout="1000"></a-cursor>
  </a-entity>

</a-scene>
